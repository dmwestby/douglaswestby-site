<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Douglas Westby | Coming soon</title>
  <meta name="description" content="Douglas Westby, PMP, P.Eng. Project management and telecommunications engineering. New website coming soon.">
  <meta name="theme-color" content="#0e0e0b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0e0b;
      --bg-2: #17170f;
      --ink: #f4f1e8;
      --muted: #a8a496;
      --line: rgba(250, 195, 18, 0.14);
      --accent: #fac312;
      --accent-dim: rgba(250, 195, 18, 0.55);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "PT Sans", system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* Background: a faint schedule grid with animated timeline bars */
    .grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(to right, var(--line) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 80px 100%, 100% 56px;
      mask-image: radial-gradient(ellipse at 50% 45%, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 45%, #000 20%, transparent 75%);
    }
    .bars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .bar {
      position: absolute; height: 10px; border-radius: 5px;
      background: linear-gradient(90deg, var(--accent-dim), var(--accent));
      opacity: 0.16;
      transform-origin: left center;
      animation: grow 9s ease-in-out infinite;
    }
    .bar::after {
      content: ""; position: absolute; right: -4px; top: 50%;
      width: 8px; height: 8px; margin-top: -4px;
      background: var(--accent); transform: rotate(45deg); border-radius: 1px;
    }
    @keyframes grow {
      0%   { transform: scaleX(0.15); }
      45%  { transform: scaleX(1); }
      80%  { transform: scaleX(1); opacity: 0.16; }
      100% { transform: scaleX(0.15); opacity: 0.06; }
    }
    .glow {
      position: fixed; z-index: 0; pointer-events: none;
      width: 70vmax; height: 70vmax; left: 50%; top: 45%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(250,195,18,0.10), transparent 60%);
    }

    main {
      position: relative; z-index: 1;
      min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      padding: 48px 16px;
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 10px;
      font: 700 12px/1 "Oxygen", sans-serif; letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--accent);
      padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
      background: rgba(250,195,18,0.04);
      animation: rise .8s ease-out both;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 0 0 rgba(250,195,18,0.6);
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(250,195,18,0.55); }
      100% { box-shadow: 0 0 0 10px rgba(250,195,18,0); }
    }
    h1 {
      margin: 28px 0 0;
      font: 700 clamp(44px, 9vw, 104px)/0.95 "Oxygen", sans-serif;
      letter-spacing: -0.03em;
      animation: rise .8s .1s ease-out both;
    }
    h1 span { color: var(--accent); }
    .role {
      margin: 22px 0 0; min-height: 1.5em;
      font-size: clamp(17px, 2.4vw, 22px); color: var(--muted);
      animation: rise .8s .2s ease-out both;
    }
    .role b { color: var(--ink); font-weight: 700; }
    .cursor {
      display: inline-block; width: 2px; height: 1.05em; margin-left: 3px;
      background: var(--accent); vertical-align: -0.15em;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .creds {
      list-style: none; padding: 0; margin: 40px 0 0;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
      animation: rise .8s .3s ease-out both;
    }
    .creds li {
      font: 700 13px/1 "Oxygen", sans-serif; letter-spacing: 0.06em;
      padding: 10px 14px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.03);
      color: var(--ink);
    }
    .creds li small {
      display: block; margin-top: 5px;
      font: 400 11px/1 "PT Sans", sans-serif; letter-spacing: 0.02em; color: var(--muted);
    }

    .progress {
      width: min(420px, 100%); margin: 48px auto 0;
      animation: rise .8s .4s ease-out both;
    }
    .progress-label {
      display: flex; justify-content: space-between;
      font-size: 13px; color: var(--muted); margin-bottom: 10px;
    }
    .progress-label strong { color: var(--accent); font-weight: 700; }
    .track {
      height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden;
    }
    .fill {
      height: 100%; width: 72%; border-radius: 3px;
      background: linear-gradient(90deg, var(--accent-dim), var(--accent));
      position: relative; overflow: hidden;
    }
    .fill::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
      transform: translateX(-100%);
      animation: shine 2.6s ease-in-out infinite;
    }
    @keyframes shine { to { transform: translateX(100%); } }

    .links {
      margin: 44px 0 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
      animation: rise .8s .5s ease-out both;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 13px 20px; border-radius: 10px;
      font: 700 15px/1 "PT Sans", sans-serif; text-decoration: none;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .btn svg { width: 18px; height: 18px; flex: none; }
    .btn-primary { background: var(--accent); color: #17170f; }
    .btn-primary:hover { background: #ffd23f; transform: translateY(-1px); }
    .btn-ghost { color: var(--ink); border: 1px solid rgba(255,255,255,0.16); }
    .btn-ghost:hover { border-color: var(--accent); transform: translateY(-1px); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    footer {
      position: relative; z-index: 1;
      text-align: center; padding: 0 16px 28px;
      font-size: 13px; color: var(--muted);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    @media (max-width: 560px) {
      .grid { background-size: 56px 100%, 100% 44px; }
      .creds li { padding: 9px 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <div class="bars" aria-hidden="true">
    <div class="bar" style="top:14%; left:6%;  width:22%; animation-delay:0s"></div>
    <div class="bar" style="top:22%; left:24%; width:16%; animation-delay:1.2s"></div>
    <div class="bar" style="top:30%; left:62%; width:26%; animation-delay:.6s"></div>
    <div class="bar" style="top:68%; left:8%;  width:30%; animation-delay:2s"></div>
    <div class="bar" style="top:76%; left:40%; width:20%; animation-delay:2.8s"></div>
    <div class="bar" style="top:84%; left:58%; width:28%; animation-delay:1.6s"></div>
    <div class="bar" style="top:60%; left:72%; width:18%; animation-delay:3.4s"></div>
  </div>

  <main>
    <div class="eyebrow"><span class="dot"></span>New site in progress</div>

    <h1>Douglas<br><span>Westby</span></h1>

    <p class="role" aria-live="polite">
      <b id="role">Project Management Professional</b><span class="cursor" aria-hidden="true"></span>
    </p>

    <ul class="creds" aria-label="Credentials">
      <li>PMP®<small>PMI</small></li>
      <li>P.Eng<small>Telecoms &amp; Electronics</small></li>
      <li>PSM I<small>Scrum.org</small></li>
      <li>AHPP™<small>PMI</small></li>
    </ul>

    <div class="progress" role="img" aria-label="Website build in progress">
      <div class="progress-label"><span>Building something better</span><strong>Launching soon</strong></div>
      <div class="track"><div class="fill"></div></div>
    </div>

    <div class="links">
      <a class="btn btn-primary" href="mailto:douglas.westby@gmail.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        Get in touch
      </a>
      <a class="btn btn-ghost" href="https://www.linkedin.com/in/douglaswestby/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9.75h4v11H3v-11Zm6.5 0h3.8v1.5h.06c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.77 2.65 4.77 6.1v5.45h-4v-4.83c0-1.15-.02-2.63-1.6-2.63-1.6 0-1.85 1.25-1.85 2.55v4.91h-4v-11Z"/></svg>
        LinkedIn
      </a>
    </div>
  </main>

  <footer>&copy; <span id="year">2026</span> Douglas Westby · Belize</footer>

  <script>
    (function () {
      var roles = [
        "Project Management Professional",
        "Professional Engineer, Telecoms & Electronics",
        "Professional Scrum Master",
        "Agile Hybrid Project Pro"
      ];
      var el = document.getElementById("role");
      document.getElementById("year").textContent = new Date().getFullYear();
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var i = 0, pos = roles[0].length, deleting = true, pause = 2200;
      function tick() {
        var word = roles[i];
        if (deleting) {
          pos--;
          el.textContent = word.slice(0, pos);
          if (pos === 0) { deleting = false; i = (i + 1) % roles.length; return setTimeout(tick, 350); }
          return setTimeout(tick, 28);
        }
        word = roles[i];
        pos++;
        el.textContent = word.slice(0, pos);
        if (pos === word.length) { deleting = true; return setTimeout(tick, pause); }
        setTimeout(tick, 55);
      }
      setTimeout(tick, pause);
    })();
  </script>
</body>
</html>
